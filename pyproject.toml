[project]
name = "preauth-agent"
version = "1.0.0"
description = "A medical prior-authorization agent: rule-based clinical and coverage checks via tools (also exposed over MCP), an LLM-written rationale, and a mandatory human approval step."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo David Padilla Romero" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
ml = ["scikit-learn>=1.5", "numpy>=1.26"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "httpx>=0.28",
  "scikit-learn>=1.5",
  "numpy>=1.26",
]

[project.scripts]
preauth = "preauth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["preauth*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
